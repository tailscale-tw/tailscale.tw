name: Deploy to Cloudflare Workers

permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: Code standards
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v6

      - name: "📦 Setup bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: "📦 Install dependencies"
        run: bun install --frozen-lockfile

      - name: "📝 AutoCorrect (CJK spacing)"
        run: bun run lint:text

      - name: "🔎 Lint code"
        run: bun run lint

      - name: "📝 Checking code format"
        run: bun run format:check

  deploy:
    name: Build & Deploy
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v6
        with:
          # 完整歷史：`getLastUpdated` 的 git log 與 sitemap 的 <lastmod> 都要
          # 每個檔案的實際最後修改時間，shallow clone 會讓所有頁面拿到同一時間。
          fetch-depth: 0

      - name: "⬢ Setup Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: "📦 Setup bun"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: "📦 Install dependencies"
        run: bun install --frozen-lockfile

      - name: "🧐 Type check"
        run: bun run typecheck

      - name: "🚀 Build the project"
        run: bun run build

      # 內部連結檢查需要建置產生的 .nimbus/routes.json，所以放在 build 之後
      - name: "📚 Lint docs"
        run: bun run lint:docs

      - name: "☁️ Deploy to Cloudflare Workers"
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          # 設定讀自 wrangler.jsonc；--message 用 SHA（Cloudflare API 拒絕非 ASCII 字串）
          command: deploy --message="${{ github.sha }}"

  indexnow:
    name: Notify IndexNow
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 只呼叫外部 action 抓公開 sitemap，不需 deploy job 的 deployments: write。
    permissions:
      contents: read

    steps:
      # 等 Cloudflare 邊緣節點完成新部署的傳播，確保 IndexNow 抓到的是
      # 更新後的 sitemap（含新文章）。
      - name: "⏳ Wait for edge propagation"
        run: sleep 30

      - name: "📡 Notify IndexNow"
        # SHA-pinned to v3.0.0 (38ddfbd) — mitigates floating-tag supply-chain risk.
        uses: bojieyang/indexnow-action@38ddfbd93579a8a44c0dee662121bf9d51098f71 # v3.0.0
        with:
          sitemap-location: "https://tailscale.tw/sitemap-index.xml"
          # IndexNow key 本即公開（驗證檔 public/6930…txt 任何人可訪問），故直接內嵌。
          key: "69309504354a19c8396274e569bc9eb7"
          # 通用端點，一次通知所有參與的搜尋引擎（Bing、Yandex、Seznam、Naver…）。
          endpoint: api.indexnow.org
          # 站內文章更新頻率低，回看 14 天即涵蓋少見的連續更新；
          # 重複提交為冪等操作，無副作用。
          since: 14
          since-unit: day
